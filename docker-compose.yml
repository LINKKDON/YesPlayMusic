services:
  MyMusic:
    build:
      context: .
    image: mymusic
    container_name: MyMusic
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./docker/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 80:80
    restart: always
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    networks:
      my_network:

networks:
  my_network:
    driver: bridge
